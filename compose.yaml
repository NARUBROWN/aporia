services:
  postgres:
    image: postgres:17-alpine
    container_name: aporia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aporia
      POSTGRES_USER: aporia
      POSTGRES_PASSWORD: aporia
    ports:
      - "5432:5432"
    volumes:
      - aporia-postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aporia -d aporia"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  aporia-postgres-data:
